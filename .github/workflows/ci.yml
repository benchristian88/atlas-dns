name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgres://atlas_dns:atlas-dns-ci@127.0.0.1:5432/atlas_dns?sslmode=disable
      ATLAS_DNS_VERSION: 1.0.0
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: atlas_dns
          POSTGRES_USER: atlas_dns
          POSTGRES_PASSWORD: atlas-dns-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_dns -d atlas_dns"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Check formatting
        run: make fmt-check
      - name: Lint and vet
        run: make lint
      - name: Test backend, migrations, and frontend
        run: make test
      - name: Race-test backend and migrations
        run: make test-race
      - name: Audit production frontend dependencies
        working-directory: web
        run: npm audit --omit=dev
      - name: Audit Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: Build release inputs
        run: make build
      - name: Validate production container definition
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: unused
          PUBLIC_BASE_URL: http://controller.example.test:8080
          SESSION_SECRET: c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M=
          CREDENTIAL_ENCRYPTION_KEY: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
