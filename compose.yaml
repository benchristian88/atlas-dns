name: atlas-dns

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas_dns}
      POSTGRES_USER: ${POSTGRES_USER:-atlas_dns}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  atlas-dns:
    image: ghcr.io/benchristian88/atlas-dns:${ATLAS_DNS_VERSION:?set ATLAS_DNS_VERSION to an exact release such as 1.0.1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      INSTALLATION_TYPE: docker
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-atlas_dns}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atlas_dns}?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY in .env}
      # Deprecated v1.0.x values seed PostgreSQL once during upgrade. System
      # Settings is authoritative after initialization.
      SESSION_DURATION: ${SESSION_DURATION:-12h}
      NODE_HEALTH_INTERVAL: ${NODE_HEALTH_INTERVAL:-30s}
      NODE_REQUEST_TIMEOUT: ${NODE_REQUEST_TIMEOUT:-10s}
      STATISTICS_POLL_INTERVAL: ${STATISTICS_POLL_INTERVAL:-1h}
      QUERY_LOG_COLLECTION_ENABLED: ${QUERY_LOG_COLLECTION_ENABLED:-true}
      QUERY_LOG_POLL_INTERVAL: ${QUERY_LOG_POLL_INTERVAL:-30s}
      QUERY_LOG_RETENTION: ${QUERY_LOG_RETENTION:-168h}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTO_MIGRATE: "true"
      WEB_DIST_DIR: /usr/local/share/atlas-dns/web
    ports:
      - "${ATLAS_DNS_BIND_ADDRESS:-0.0.0.0}:${ATLAS_DNS_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - atlas-dns-work:/var/lib/atlas-dns/tmp
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  atlas-dns-work:
